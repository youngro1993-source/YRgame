<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monster Game Test</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0d0e15;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
    }
    canvas {
      border: 2px solid cyan;
      background: #000;
      display: block;
    }
    .container {
      position: relative;
      width: 100%;
      max-width: 500px;
      height: 100%;
      max-height: 750px;
    }
  </style>
</head>
<body>
  <div class="container">
    <canvas id="canvas" width="500" height="750"></canvas>
  </div>

  <script>
    console.log("게임 로드 시작!");
    
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    console.log("캔버스 준비 완료!");

    // 간단한 테스트 화면
    ctx.fillStyle = "#00f0ff";
    ctx.font = "30px Arial";
    ctx.textAlign = "center";
    ctx.fillText("게임 로드됨!", canvas.width / 2, 100);
    ctx.font = "16px Arial";
    ctx.fillText("이 텍스트가 보이면 정상입니다", canvas.width / 2, 200);
    ctx.fillText("F12를 눌러 Console을 확인하세요", canvas.width / 2, 250);

    console.log("테스트 완료!");
  </script>
</body>
</html>
